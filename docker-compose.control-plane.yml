services:
  control-plane:
    build:
      context: ./server
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    env_file:
      - ./server/.env
    ports:
      - "8080:8080"
    volumes:
      - control-plane-data:/app/data
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: legacy-admin/Dockerfile
    environment:
      API_BASE_URL: http://control-plane:8080
    ports:
      - "3001:3000"
    depends_on:
      - control-plane
    restart: unless-stopped

volumes:
  control-plane-data:

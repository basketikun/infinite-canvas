name: Publish Canvas Agent

on:
  push:
    branches: ["main"]
    paths:
      - "canvas-agent/**"
      - ".github/workflows/publish-canvas-agent.yml"
  pull_request:
    paths:
      - "canvas-agent/**"
      - ".github/workflows/publish-canvas-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-canvas-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: canvas-agent/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

      - id: package
        name: Check package version
        shell: bash
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "name=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: github.event_name == 'push' && github.repository == 'basketikun/infinite-canvas' && steps.package.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Verify published version
        if: github.event_name == 'push' && github.repository == 'basketikun/infinite-canvas' && steps.package.outputs.exists == 'false'
        shell: bash
        run: |
          for attempt in {1..12}; do
            published="$(npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version 2>/dev/null || true)"
            if [ "$published" = "${{ steps.package.outputs.version }}" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Published version did not become visible in npm registry" >&2
          exit 1

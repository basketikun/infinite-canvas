services:
  control-plane:
    environment:
      STORAGE_DRIVER: postgres
      DATABASE_DSN: postgres://infinite_canvas:change-this-db-password@postgres:5432/infinite_canvas?sslmode=disable
      SYNC_S3_ENDPOINT: http://minio:9000
      SYNC_S3_ACCESS_KEY: minioadmin
      SYNC_S3_SECRET_KEY: change-this-minio-password
      SYNC_S3_BUCKET: infinite-canvas-sync
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: infinite_canvas
      POSTGRES_USER: infinite_canvas
      POSTGRES_PASSWORD: change-this-db-password
    volumes:
      - cloud-sync-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinite_canvas -d infinite_canvas"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-this-minio-password
    command: server /data
    volumes:
      - cloud-sync-minio:/data

volumes:
  cloud-sync-postgres:
  cloud-sync-minio:

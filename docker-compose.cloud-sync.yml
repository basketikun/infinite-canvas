services:
  control-plane:
    environment:
      STORAGE_DRIVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请通过 --env-file 提供 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请通过 --env-file 提供 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请通过 --env-file 提供 POSTGRES_PASSWORD}
    volumes:
      - cloud-sync-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinite_canvas -d infinite_canvas"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请通过 --env-file 提供 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请通过 --env-file 提供 MINIO_ROOT_PASSWORD}
    command: server /data
    volumes:
      - cloud-sync-minio:/data

volumes:
  cloud-sync-postgres:
  cloud-sync-minio:
